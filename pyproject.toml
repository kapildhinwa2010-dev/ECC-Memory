[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecc_memory"
version = "0.1.0"
description = "ECC-Memory - XOR-parity error-correcting memory slots against bit-rot"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
