[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ECC-Memory"
version = "1.0.0"
description = "Error-correcting code memory system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kapil Dhinwa"}]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/ECC-Memory"

[tool.setuptools]
packages = ["ecc_memory"]
